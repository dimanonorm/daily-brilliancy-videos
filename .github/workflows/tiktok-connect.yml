name: TikTok connect

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Authorization code from the TikTok callback page"
        required: true

permissions:
  contents: write

concurrency:
  group: tiktok
  cancel-in-progress: false

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Exchange code and store encrypted tokens
        env:
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_TOKEN_KEY: ${{ secrets.TT_TOKEN_KEY }}
          CODE: ${{ inputs.code }}
        run: python scripts/tiktok.py connect "$CODE"
      - name: Save state
        if: always()
        run: |
          git config user.name "daily-brilliancy-bot"
          git config user.email "dimanonorm@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "TikTok connect [skip ci]"
          git pull --rebase -q && git push
