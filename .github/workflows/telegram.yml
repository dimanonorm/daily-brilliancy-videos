name: Telegram bot

on:
  workflow_dispatch:   # bot switched off by the owner (2026-10-27)

permissions:
  contents: write

concurrency:
  group: tiktok
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Quick check for new messages
        id: peek
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          SONGS_KEY: ${{ secrets.SONGS_KEY }}
        run: |
          OFF=$(python3 -c "import json,os;print(json.load(open('state/telegram.json')).get('offset',0) if os.path.exists('state/telegram.json') else 0)")
          TOK=$(echo -n "$TG_BOT_TOKEN" | tr -d '[:space:]')
          curl -s "https://api.telegram.org/bot${TOK}/getUpdates?offset=${OFF}&timeout=0" > /tmp/upd.json
          curl -s "https://api.telegram.org/bot${TOK}/getMe" > /tmp/me.json
          curl -s "https://api.telegram.org/bot${TOK}/getWebhookInfo" > /tmp/wh.json
          N=$(python3 -c "import json;print(len(json.load(open('/tmp/upd.json')).get('result',[])))")
          INB=$(ls inbox 2>/dev/null | grep -v failed | wc -l)
          echo "new=$N inbox=$INB"
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 - <<'PY' > state/telegram_check.md
          import json,os
          d=json.load(open('/tmp/upd.json'))
          print("# Telegram check")
          print("- token secret present:", bool(os.environ.get('TG_BOT_TOKEN','').strip()))
          print("- songs key present:", bool(os.environ.get('SONGS_KEY','').strip()))
          print("- api ok:", d.get('ok'), d.get('description',''))
          print("- pending updates:", len(d.get('result',[])))
          me=json.load(open('/tmp/me.json')).get('result',{})
          print("- bot:", me.get('first_name'), '@'+str(me.get('username')))
          wh=json.load(open('/tmp/wh.json')).get('result',{})
          print("- webhook set:", bool(wh.get('url')), "pending:", wh.get('pending_update_count'))
          import datetime; print("- checked at:", datetime.datetime.utcnow().isoformat()+"Z")
          PY
            git config user.name "daily-brilliancy-bot"; git config user.email "dimanonorm@users.noreply.github.com"
            git add state/telegram_check.md; git commit -qm "Bot: check [skip ci]" || true; git pull --rebase -q; git push -q || true
          fi
          if [ "$N" = "0" ] && [ "$INB" = "0" ]; then echo "run=no" >> $GITHUB_OUTPUT; else echo "run=yes" >> $GITHUB_OUTPUT; fi
      - if: steps.peek.outputs.run == 'yes'
        name: Tools
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
          NEEDRESTART_SUSPEND: "1"
        run: |
          pip install -q opencv-python-headless numpy requests pytesseract imageio-ffmpeg
          if ! command -v ffmpeg >/dev/null; then
            FF=$(python3 -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
            mkdir -p $HOME/bin && ln -sf "$FF" $HOME/bin/ffmpeg && echo "$HOME/bin" >> $GITHUB_PATH
          fi
          if ! command -v tesseract >/dev/null; then
            echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections || true
            sudo rm -f /var/lib/man-db/auto-update || true
            for i in 1 2 3; do
              sudo -E timeout 240 apt-get -o DPkg::Lock::Timeout=60 -o Acquire::Retries=3 -o Dpkg::Options::=--force-confdef \
                install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-eng && break
              echo "retry $i"; sudo -E timeout 120 apt-get -o DPkg::Lock::Timeout=60 update -qq || true
            done
          fi
          command -v tesseract && tesseract --version | head -1
      - if: steps.peek.outputs.run == 'yes'
        name: Make videos
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          SONGS_KEY: ${{ secrets.SONGS_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_TOKEN_KEY: ${{ secrets.TT_TOKEN_KEY }}
        run: |
          git config user.name "daily-brilliancy-bot"
          git config user.email "dimanonorm@users.noreply.github.com"
          python engine/bot.py
